<!DOCTYPE html>
<!--
  Crypto-Course — Module Video Landing Page
  ==========================================
  CONTROL LAYER: Every printed QR code in the Arabic textbook points here.
  Stable URL pattern: /videos/module.html?m=N  (N = 1..14)

  To change a video source after printing:
    1. Open /videos/videos.json
    2. Replace the URL for the relevant entry
    3. git commit && git push — done. No reprint required.

  This page re-fetches videos.json on every visit. The printed QR codes
  never need to change because they point to THIS page, not to YouTube.

  Architecture:
    videos.json  ←  edit this to update destinations
         ↓
    module.html?m=N  ←  this is the stable printed URL
         ↓
    Learner clicks Watch → goes to actual video platform
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>فيديوهات الوحدة | Crypto-Course</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0F172A;
      --surface:  #1E293B;
      --border:   #334155;
      --primary:  #2563EB;
      --text:     #F1F5F9;
      --text2:    #94A3B8;
      --text3:    #64748B;
      --green:    #34D399;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 3px solid var(--primary);
      padding: 1.25rem 1rem 1.1rem;
      text-align: center;
    }
    .course-tag {
      font-size: 0.72rem;
      color: var(--text3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .module-badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 0.55rem;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.3rem;
    }
    .header .en-title {
      font-size: 0.78rem;
      color: var(--text3);
    }

    /* ── Main content ── */
    main {
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .intro-note {
      text-align: center;
      color: var(--text3);
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
    }

    /* ── Video card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.28);
      border-radius: 20px;
      padding: 0.22rem 0.7rem;
      font-size: 0.73rem;
      color: #93C5FD;
      margin-bottom: 0.85rem;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .type-badge .badge-en {
      opacity: 0.55;
    }
    .card h2 {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
      line-height: 1.45;
    }
    .card .en-sub {
      font-size: 0.76rem;
      color: var(--text3);
      margin-bottom: 1rem;
    }

    /* ── Buttons ── */
    .btn-watch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 50px;
      margin-bottom: 0.8rem;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-watch:focus-visible { outline: 3px solid #93C5FD; outline-offset: 2px; }
    .btn-watch:active { background: #1D4ED8; }

    .btn-soon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--border);
      color: var(--text3);
      border-radius: 10px;
      font-size: 0.9rem;
      min-height: 50px;
      margin-bottom: 0.8rem;
      cursor: not-allowed;
      user-select: none;
    }

    .secondary-links {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .link-action {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: #60A5FA;
      font-size: 0.8rem;
      text-decoration: none;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid transparent;
      min-height: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .link-action:focus-visible { outline: 3px solid #93C5FD; outline-offset: 2px; }
    .link-action:active,
    .link-action:hover { border-color: #3B82F6; background: rgba(59,130,246,0.1); }
    .link-action.dl { color: var(--green); }
    .link-action.dl:active,
    .link-action.dl:hover { border-color: var(--green); background: rgba(52,211,153,0.1); }

    /* ── State screens ── */
    .state-wrap {
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 400px;
      margin: 2rem auto;
    }
    .state-wrap .s-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .state-wrap h2 { font-size: 1.05rem; margin-bottom: 0.55rem; }
    .state-wrap p { color: var(--text2); font-size: 0.84rem; line-height: 1.65; }
    .state-wrap .en-note { color: var(--text3); font-size: 0.76rem; margin-top: 0.6rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text3);
      font-size: 0.73rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      line-height: 1.7;
    }
    code { background: var(--border); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }

    /* ── Responsive ── */
    @media (min-width: 480px) {
      main { padding: 1.5rem; }
      .card { padding: 1.5rem; }
      .header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="root">
  <div class="state-wrap" role="status" aria-live="polite">
    <div class="s-icon">⏳</div>
    <p>جارٍ التحميل… (Loading…)</p>
  </div>
</div>

<noscript>
  <div style="padding:2rem;text-align:center;color:#F1F5F9;background:#0F172A;font-family:sans-serif">
    <p>يتطلب هذا الموقع تفعيل JavaScript.</p>
    <p dir="ltr" style="margin-top:.5rem;color:#94A3B8">This page requires JavaScript to be enabled.</p>
  </div>
</noscript>

<script>
/*
 * CONTROL LAYER — all printed QR links point here.
 * To change a video URL: edit videos.json, push to GitHub. No reprint needed.
 */

const VIDEO_ORDER = ['concept_intro', 'worked_example', 'lab_walkthrough', 'quiz_review'];

const TYPE_META = {
  concept_intro:   { icon: '\u{1F3AC}', ar: 'مقدمة المفهوم',    en: 'Concept Introduction' },
  worked_example:  { icon: '✏️',  ar: 'مثال محلول',      en: 'Worked Example'       },
  lab_walkthrough: { icon: '\u{1F52C}', ar: 'شرح المختبر',      en: 'Lab Walkthrough'      },
  quiz_review:     { icon: '\u{1F4DD}', ar: 'مراجعة الاختبار',  en: 'Quiz Review'          },
};

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function isPlaceholder(url) {
  return !url || url.startsWith('https://PLACEHOLDER');
}

function renderCard(video) {
  const meta = TYPE_META[video.type] || { icon: '▶', ar: video.type, en: video.type };
  const watchOk    = !isPlaceholder(video.primary_url);
  const mirrorOk   = !isPlaceholder(video.mirror_url);
  const downloadOk = !isPlaceholder(video.download_url);

  const watchBtn = watchOk
    ? '<a class="btn-watch" href="' + esc(video.primary_url) + '" target="_blank" rel="noopener noreferrer" aria-label="شاهد الفيديو">' +
        '<span aria-hidden="true">▶</span>' +
        '<span>شاهد (Watch)</span>' +
      '</a>'
    : '<div class="btn-soon" role="img" aria-label="قريباً">' +
        '<span aria-hidden="true">\u{1F51C}</span>' +
        '<span>قريباً (Coming Soon)</span>' +
      '</div>';

  const mirrorLink = mirrorOk
    ? '<a class="link-action" href="' + esc(video.mirror_url) + '" target="_blank" rel="noopener noreferrer">' +
        '🔗 مرايا (Mirror)' +
      '</a>'
    : '';

  const downloadLink = downloadOk
    ? '<a class="link-action dl" href="' + esc(video.download_url) + '" target="_blank" rel="noopener noreferrer" download>' +
        '⬇ تنزيل بجودة منخفضة (Low-quality download)' +
      '</a>'
    : '';

  const secondaryHtml = (mirrorLink || downloadLink)
    ? '<div class="secondary-links">' + mirrorLink + downloadLink + '</div>'
    : '';

  return (
    '<article class="card" aria-label="' + esc(video.title_ar) + '">' +
      '<div class="type-badge" aria-hidden="true">' +
        '<span>' + meta.icon + '</span>' +
        '<span>' + esc(meta.ar) + '</span>' +
        '<span class="badge-en" dir="ltr">(' + esc(meta.en) + ')</span>' +
      '</div>' +
      '<h2>' + esc(video.title_ar) + '</h2>' +
      '<p class="en-sub" dir="ltr">' + esc(video.title_en) + '</p>' +
      watchBtn +
      secondaryHtml +
    '</article>'
  );
}

function show(html) {
  document.getElementById('root').innerHTML = html;
}

async function init() {
  const params    = new URLSearchParams(window.location.search);
  const mParam    = params.get('m');
  const moduleNum = parseInt(mParam, 10);

  if (!mParam || isNaN(moduleNum) || moduleNum < 1 || moduleNum > 14) {
    show(
      '<div class="state-wrap">' +
        '<div class="s-icon">⚠️</div>' +
        '<h2>رابط غير صحيح (Invalid Link)</h2>' +
        '<p>يجب أن يحتوي الرابط على رقم وحدة من ١ إلى ١٤.</p>' +
        '<p class="en-note" dir="ltr">The URL must include a module number from 1 to 14.<br>' +
        'Example: <code>module.html?m=3</code></p>' +
      '</div>'
    );
    return;
  }

  try {
    const resp = await fetch('./videos.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + resp.statusText);
    const modules = await resp.json();
    const mod = modules.find(function(m) { return m.module === moduleNum; });

    if (!mod) {
      show(
        '<div class="state-wrap">' +
          '<div class="s-icon">🔍</div>' +
          '<h2>الوحدة غير موجودة (Module Not Found)</h2>' +
          '<p>الوحدة رقم ' + esc(String(moduleNum)) + ' غير موجودة في القائمة.</p>' +
          '<p class="en-note" dir="ltr">Module ' + esc(String(moduleNum)) + ' was not found in videos.json.</p>' +
        '</div>'
      );
      return;
    }

    document.title = 'الوحدة ' + moduleNum + ': ' + mod.title_ar + ' | Crypto-Course';

    // Render in canonical order regardless of JSON order
    const sorted = VIDEO_ORDER
      .map(function(t) { return mod.videos.find(function(v) { return v.type === t; }); })
      .filter(Boolean);

    const cards = sorted.map(renderCard).join('');

    show(
      '<header class="header">' +
        '<div class="course-tag">Crypto-Course — كورس التشفير</div>' +
        '<div class="module-badge">الوحدة ' + moduleNum + ' / Module ' + moduleNum + '</div>' +
        '<h1>' + esc(mod.title_ar) + '</h1>' +
        '<p class="en-title" dir="ltr">' + esc(mod.title_en) + '</p>' +
      '</header>' +
      '<main>' +
        '<p class="intro-note" aria-label="' + sorted.length + ' فيديوهات لهذه الوحدة">' +
          sorted.length + ' فيديوهات &nbsp;·&nbsp; ' +
          '<span dir="ltr">' + sorted.length + ' videos for this module</span>' +
        '</p>' +
        cards +
      '</main>' +
      '<footer>' +
        '<p>Crypto-Course &copy; ' + new Date().getFullYear() + '</p>' +
        '<p dir="ltr" style="margin-top:.35rem">' +
          'To update video links, edit <code>videos.json</code> and push — no QR reprint needed.' +
        '</p>' +
      '</footer>'
    );

  } catch (err) {
    show(
      '<div class="state-wrap">' +
        '<div class="s-icon">📡</div>' +
        '<h2>خطأ في التحميل (Load Error)</h2>' +
        '<p>تعذّر تحميل بيانات الفيديوهات. تحقّق من اتصال الإنترنت وأعد المحاولة.</p>' +
        '<p class="en-note" dir="ltr">' +
          'Could not load video data. Check your connection and try again.<br>' +
          '<small>' + esc(String(err)) + '</small>' +
        '</p>' +
      '</div>'
    );
  }
}

init();
</script>

</body>
</html>
