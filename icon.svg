  <rect x="244" y="332" width="24" height="42" rx="10" fill="#1E3A8A"/>
  <!-- XP accent dots (decorative) -->
  <circle cx="96" cy="96" r="10" fill="#60A5FA" opacity="0.5"/>
  <circle cx="416" cy="96" r="10" fill="#60A5FA" opacity="0.5"/>
