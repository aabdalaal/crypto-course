<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crypto-Course">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182340"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.24" r="0.75">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Lock group -->
  <g filter="url(#shadow)">
    <!-- Shackle (drawn first so its ends tuck behind the body) -->
    <path d="M191.5 244 A64.5 64.5 0 0 1 320.5 244"
          fill="none" stroke="#E2E8F7" stroke-width="32" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="144" y="224" width="224" height="164" rx="40" fill="url(#body)"/>
    <!-- Top highlight -->
    <rect x="144" y="224" width="224" height="52" rx="40" fill="#FFFFFF" opacity="0.10"/>
    <!-- Verify check -->
    <polyline points="211,314 247,342 310,280"
              fill="none" stroke="#10B981" stroke-width="25"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
